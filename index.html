min<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Racing Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0d0000; color: white; font-family: Arial, sans-serif; text-align: center; }
    .screen { display: none; min-height: 100vh; }
    .screen.active { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
    #menuScreen { background: linear-gradient(135deg, #1a0000, #0d0000); }
    #menuScreen h1 { font-size: 3em; color: #ff0000; text-shadow: 0 0 30px #ff0000; letter-spacing: 4px; margin-bottom: 10px; }
    #menuScreen p { opacity: 0.7; margin-bottom: 40px; font-size: 1.1em; }
    #garageScreen { background: linear-gradient(135deg, #1a0000, #0d0000); }
    #garageScreen h2 { font-size: 2em; color: #ff0000; margin-bottom: 10px; }
    #garageScreen p { opacity: 0.7; margin-bottom: 30px; }
    .car-options { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; margin-bottom: 30px; }
    .car-option { width: 100px; padding: 15px; border-radius: 16px; cursor: pointer; border: 3px solid transparent; background: #1a1a1a; }
    .car-option.selected { border-color: #ff0000; box-shadow: 0 0 15px #ff000066; }
    .car-preview { width: 40px; height: 70px; border-radius: 8px; margin: 0 auto 10px; }
    .car-option span { font-size: 0.85em; opacity: 0.8; }
    .big-btn { display: block; width: 260px; padding: 18px; margin: 10px auto; font-size: 1.3em; font-weight: bold; border-radius: 30px; cursor: pointer; border: none; }
    .red-btn { background: #ff0000; color: white; box-shadow: 0 0 20px #ff000088; }
    .outline-btn { background: transparent; color: white; border: 2px solid #ff0000; }
    .dark-btn { background: #222; color: white; border: 2px solid #ff0000; }
    #gameScreen { display: none; flex-direction: column; min-height: 100vh; }
    #gameScreen.active { display: flex; }
    header { background: linear-gradient(135deg, #ff0000, #8b0000); padding: 20px; }
    header h1 { font-size: 2em; letter-spacing: 4px; }
    canvas { border-radius: 12px; display: block; margin: 0 auto; }
    .game-section { padding: 20px; background: #0a0a1a; }
    .score-box { font-size: 1.3em; margin: 15px 0; color: #ff4444; }
    .controls { display: flex; justify-content: center; gap: 20px; margin-top: 20px; }
    .ctrl-btn { padding: 20px 40px; font-size: 1.5em; background: #cc0000; color: white; border: none; border-radius: 16px; cursor: pointer; user-select: none; -webkit-user-select: none; }
    .ctrl-btn:active { background: #8b0000; }
    #restartBtn, #homeBtn { display: none; margin: 8px auto; padding: 12px 30px; font-size: 1em; font-weight: bold; border-radius: 20px; cursor: pointer; }
    #restartBtn { background: #cc0000; color: white; border: none; }
    #homeBtn { background: transparent; color: white; border: 2px solid #ff0000; }
  </style>
</head>
<body>

<!-- MENU -->
<div id="menuScreen" class="screen active">
  <div style="font-size:5em; margin-bottom:10px;">🏎️</div>
  <h1>RACING GAME</h1>
  <p>Dodge enemies. Beat your score!</p>
  <button class="big-btn red-btn" id="startBtn">▶ START GAME</button>
  <button class="big-btn dark-btn" id="garageBtn">🚗 GARAGE</button>
</div>

<!-- GARAGE -->
<div id="garageScreen" class="screen">
  <div style="font-size:3em; margin-bottom:10px;">🚗</div>
  <h2>GARAGE</h2>
  <p>Pick your car color!</p>
  <div class="car-options">
    <div class="car-option selected" id="car-white">
      <div class="car-preview" style="background:#ffffff;"></div>
      <span>White</span>
    </div>
    <div class="car-option" id="car-blue">
      <div class="car-preview" style="background:#0044ff;"></div>
      <span>Blue</span>
    </div>
  </div>
  <button class="big-btn red-btn" id="garageStartBtn">▶ START GAME</button>
  <button class="big-btn outline-btn" id="backBtn">← Back</button>
</div>

<!-- GAME -->
<div id="gameScreen" class="screen">
  <header><h1>🏎️ RACING GAME</h1></header>
  <section class="game-section">
    <div class="score-box">Score: <span id="score">0</span> &nbsp;|&nbsp; Best: <span id="best">0</span></div>
    <canvas id="gameCanvas" width="320" height="460"></canvas>
    <button id="restartBtn">🔄 Play Again</button>
    <button id="homeBtn">🏠 Main Menu</button>
    <div class="controls">
      <button class="ctrl-btn" id="leftBtn">⬅️</button>
      <button class="ctrl-btn" id="rightBtn">➡️</button>
    </div>
  </section>
</div>

<footer style="padding:20px; opacity:0.5; font-size:0.85em; border-top:1px solid #330000; margin-top:20px;">
  <p>© 2026 Racing Game — All Rights Reserved</p>
  <p>Made with ❤️ by <strong>Ahmed</strong></p>
</footer>
</body>
</html>
