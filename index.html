<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Racing Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0d0000; color: white; font-family: Arial, sans-serif; text-align: center; }

    /* MENU */
    #menuScreen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #1a0000, #0d0000);
      padding: 20px;
    }
    #menuScreen h1 {
      font-size: 3em;
      color: #ff0000;
      text-shadow: 0 0 30px #ff0000;
      letter-spacing: 4px;
      margin-bottom: 10px;
    }
    #menuScreen p {
      opacity: 0.7;
      margin-bottom: 40px;
      font-size: 1.1em;
    }
    .menu-btn {
      width: 260px;
      padding: 18px;
      margin: 10px;
      font-size: 1.2em;
      font-weight: bold;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .menu-btn:active { transform: scale(0.95); }
    .start-btn { background: #ff0000; color: white; box-shadow: 0 0 20px #ff000088; }
    .garage-btn { background: #222; color: white; border: 2px solid #ff0000; }

    /* GARAGE */
    #garageScreen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #1a0000, #0d0000);
      padding: 20px;
    }
    #garageScreen h2 {
      font-size: 2em;
      color: #ff0000;
      margin-bottom: 10px;
      text-shadow: 0 0 15px #ff000088;
    }
    #garageScreen p { opacity: 0.7; margin-bottom: 30px; }
    .car-options {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 30px;
    }
    .car-option {
      width: 100px;
      padding: 15px;
      border-radius: 16px;
      cursor: pointer;
      border: 3px solid transparent;
      background: #1a1a1a;
      transition: transform 0.1s;
    }
    .car-option:active { transform: scale(0.95); }
    .car-option.selected { border-color: #ff0000; box-shadow: 0 0 15px #ff000066; }
    .car-preview {
      width: 40px;
      height: 70px;
      border-radius: 8px;
      margin: 0 auto 10px;
    }
    .car-option span { font-size: 0.85em; opacity: 0.8; }
    .back-btn {
      width: 260px;
      padding: 15px;
      font-size: 1.1em;
      font-weight: bold;
      border: 2px solid #ff0000;
      border-radius: 30px;
      background: transparent;
      color: white;
      cursor: pointer;
      margin-top: 10px;
    }

    /* GAME */
    #gameScreen { display: none; }
    header { background: linear-gradient(135deg, #ff0000, #8b0000); padding: 30px 20px; }
    header h1 { font-size: 2em; letter-spacing: 4px; color: white; text-shadow: 0 0 20px #ff0000; }
    canvas {
      border-radius: 12px;
      display: block;
      margin: 0 auto;
      background: #2a2a2a;
    }
    .game-section { padding: 20px; }
    .controls {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
    }
    .ctrl-btn {
      padding: 20px 40px;
      font-size: 1.5em;
      background: #cc0000;
      color: white;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      transition: transform 0.1s;
    }
    .ctrl-btn:active { transform: scale(0.93); background: #8b0000; }
    .score-box { font-size: 1.3em; margin: 15px 0; color: #ff4444; }
    .restart-btn {
      display: none;
      margin: 10px auto;
      padding: 12px 30px;
      background: #cc0000;
      color: white;
      font-size: 1.1em;
      font-weight: bold;
      border: none;
      border-radius: 20px;
      cursor: pointer;
    }
    .home-btn {
      display: none;
      margin: 5px auto;
      padding: 10px 25px;
      background: transparent;
      color: white;
      font-size: 1em;
      border: 2px solid #ff0000;
      border-radius: 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<!-- MENU SCREEN -->
<div id="menuScreen">
  <div style="font-size:4em; margin-bottom:10px;">🏎️</div>
  <h1>RACING GAME</h1>
  <p>Dodge enemies. Beat your score!</p>
  <button class="menu-btn start-btn" onclick="startGame()">▶ START GAME</button>
  <button class="menu-btn garage-btn" onclick="openGarage()">🚗 GARAGE</button>
</div>

<!-- GARAGE SCREEN -->
<div id="garageScreen">
  <div style="font-size:3em; margin-bottom:10px;">🚗</div>
  <h2>GARAGE</h2>
  <p>Pick your car color!</p>
  <div class="car-options">
    <div class="car-option selected" onclick="selectCar('#ffffff', '#aaddff', '#ff0000', this)">
      <div class="car-preview" style="background:#ffffff;"></div>
      <span>White</span>
    </div>
    <div class="car-option" onclick="selectCar('#0044ff', '#aaddff', '#ffffff', this)">
      <div class="car-preview" style="background:#0044ff;"></div>
      <span>Blue</span>
    </div>
  </div>
  <button class="menu-btn start-btn" onclick="startGame()">▶ START GAME</button>
  <button class="back-btn" onclick="openMenu()">← Back</button>
</div>

<!-- GAME SCREEN -->
<div id="gameScreen">
  <header>
    <h1>🏎️ RACING GAME</h1>
  </header>
  <section class="game-section">
    <div class="score-box">Score: <span id="score">0</span> &nbsp;|&nbsp; Best: <span id="best">0</span></div>
    <canvas id="gameCanvas" width="320" height="480"></canvas>
    <button class="restart-btn" id="restartBtn" onclick="restartGame()">🔄 Play Again</button>
    <button class="home-btn" id="homeBtn" onclick="openMenu()">🏠 Main Menu</button>
    <div class="controls">
      <button class="ctrl-btn" id="leftBtn">⬅️</button>
      <button class="ctrl-btn" id="rightBtn">➡️</button>
    </div>
  </section>
</div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  // Car colors
  let carColor = '#ffffff';
  let carWindow = '#aaddff';
  let carWheel = '#ff0000';

  function selectCar(color, window, wheel, el) {
    carColor = color; carWindow = window; carWheel = wheel;
    document.querySelectorAll('.car-option').forEach(e => e.classList.remove('selected'));
    el.classList.add('selected');
  }

  function openMenu() {
    document.getElementById('menuScreen').style.display = 'flex';
    document.getElementById('garageScreen').style.display = 'none';
    document.getElementById('gameScreen').style.display = 'none';
    gameOver = true;
  }

  function openGarage() {
    document.getElementById('menuScreen').style.display = 'none';
    document.getElementById('garageScreen').style.display = 'flex';
    document.getElementById('gameScreen').style.display = 'none';
  }

  function startGame() {
    document.getElementById('menuScreen').style.display = 'none';
    document.getElementById('garageScreen').style.display = 'none';
    document.getElementById('gameScreen').style.display = 'block';
    restartGame();
  }

  function playCrashSound() {
    const bufferSize = audioCtx.sampleRate * 0.6;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2);
    }
    const source = audioCtx.createBufferSource();
    source.buffer = buffer;
    const gainNode = audioCtx.createGain();
    gainNode.gain.setValueAtTime(1.5, audioCtx.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
    source.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    source.start();
  }
