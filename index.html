<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Racing Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0d0000; color: white; font-family: Arial, sans-serif; text-align: center; }
    header { background: linear-gradient(135deg, #ff0000, #8b0000); padding: 40px 20px; }
    header h1 { font-size: 2.5em; letter-spacing: 4px; color: white; text-shadow: 0 0 20px #ff0000; }
    header p { font-size: 1.1em; margin-top: 10px; opacity: 0.9; }
    canvas {
      border:
      border-radius: 12px;
      display: block;
      margin: 0 auto;
      background: #1a0000;
    }border: 4px solid #ffff00;
    .game-section { padding: 30px 20px; }
    .game-section h2 { font-size: 1.8em; color: #ff0000; margin-bottom: 20px; text-shadow: 0 0 10px #ff000088; }
    .controls {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
    }
    .ctrl-btn {
      padding: 20px 40px;
      font-size: 1.5em;
      background: #cc0000;
      color: white;
      border: 2px solid #ff0000;
      border-radius: 16px;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      transition: transform 0.1s;
      box-shadow: 0 0 10px #ff000066;
    }
    .ctrl-btn:active {
      transform: scale(0.93);
      background: #8b0000;
    }
    .score-box {
      font-size: 1.3em;
      margin: 15px 0;
      color: #ff4444;
      text-shadow: 0 0 8px #ff000066;
    }
    .restart-btn {
      display: none;
      margin: 15px auto;
      padding: 12px 30px;
      background: #cc0000;
      color: white;
      font-size: 1.1em;
      font-weight: bold;
      border: 2px solid #ff0000;
      border-radius: 20px;
      cursor: pointer;
    }
    footer { padding: 30px; opacity: 0.5; font-size: 0.9em; border-top: 1px solid #330000; margin-top: 40px; }
  </style>
</head>
<body>

<header>
  <h1>🏎️ RACING GAME</h1>
  <p>Dodge enemies. Beat your score. How far can you go?</p>
</header>

<section class="game-section">
  <h2>🎮 Play Now!</h2>
  <div class="score-box">Score: <span id="score">0</span> &nbsp;|&nbsp; Best: <span id="best">0</span></div>
  <canvas id="gameCanvas" width="320" height="480"></canvas>
  <button class="restart-btn" id="restartBtn" onclick="restartGame()">🔄 Play Again</button>
  <div class="controls">
    <button class="ctrl-btn" id="leftBtn">⬅️</button>
    <button class="ctrl-btn" id="rightBtn">➡️</button>
  </div>
</section>

<footer>
  <p>🏎️ Racing Game — Made with ❤️ using Kotlin & Android Studio</p>
</footer>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  let playerX = 130, score = 0, best = 0, gameOver = false;
  let enemyX = 100, enemyY = -100, enemySpeed = 5;
  let roadOffset = 0;
  let leftHeld = false, rightHeld = false;

  const playerW = 50, playerH = 80;
  const enemyW = 50, enemyH = 80;
  const playerY = canvas.height - 120;

  function handleHold() {
    if (leftHeld) playerX = Math.max(10, playerX - 8);
    if (rightHeld) playerX = Math.min(canvas.width - playerW - 10, playerX + 8);
  }

  function drawRoad() {
    roadOffset = (roadOffset + enemySpeed) % 40;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#1a0000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#ff000033';
    for (let i = -1; i < 13; i++) {
      ctx.fillRect(canvas.width/2 - 5, i * 40 + roadOffset, 10, 25);
    }
  }

  function drawCar(x, y, color, wheelColor) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.roundRect(x, y, playerW, playerH, 8);
    ctx.fill();
    ctx.fillStyle = '#ffffff22';
    ctx.fillRect(x + 8, y + 10, 34, 18);
    ctx.fillStyle = wheelColor;
    ctx.beginPath(); ctx.arc(x + 10, y + playerH - 5, 8, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 40, y + playerH - 5, 8, 0, Math.PI*2); ctx.fill();
  }

  function update() {
    if (gameOver) return;

    handleHold();
    enemyY += enemySpeed;

    if (enemyY > canvas.height) {
      enemyY = -100;
      enemyX = Math.random() * (canvas.width - enemyW - 20) + 10;
      score++;
      document.getElementById('score').textContent = score;
      if (score > best) {
        best = score;
        document.getElementById('best').textContent = best;
      }
      enemySpeed += 0.3;
    }

    // Collision
    const margin = 15;
    if (playerX + margin < enemyX + enemyW - margin &&
        playerX + playerW - margin > enemyX + margin &&
        playerY + margin < enemyY + enemyH - margin &&
        playerY + playerH - margin > enemyY + margin) {
      gameOver = true;
      document.getElementById('restartBtn').style.display = 'inline-block';
      ctx.fillStyle = 'rgba(0,0,0,0.75)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#ff0000';
      ctx.font = 'bold 40px Arial';
      ctx.fillText('GAME OVER', 40, canvas.height/2 - 20);
      ctx.fillStyle = 'white';
      ctx.font = '24px Arial';
      ctx.fillText('Score: ' + score, 110, canvas.height/2 + 30);
      return;
    }

    drawRoad();
    drawCar(enemyX, enemyY, '#ff0000', '#222222');
    drawCar(playerX, playerY, '#880000', '#ff0000');
    requestAnimationFrame(update);
  }

  function restartGame() {
    playerX = 130; score = 0; enemyY = -100;
    enemyX = 100; enemySpeed = 5; gameOver = false;
    leftHeld = false; rightHeld = false;
    document.getElementById('score').textContent = 0;
    document.getElementById('restartBtn').style.display = 'none';
    update();
  }

  // Touch hold
  document.getElementById('leftBtn').addEventListener('touchstart', e => { e.preventDefault(); leftHeld = true; });
  document.getElementById('leftBtn').addEventListener('touchend', e => { e.preventDefault(); leftHeld = false; });
  document.getElementById('rightBtn').addEventListener('touchstart', e => { e.preventDefault(); rightHeld = true; });
  document.getElementById('rightBtn').addEventListener('touchend', e => { e.preventDefault(); rightHeld = false; });

  // Mouse hold
  document.getElementById('leftBtn').addEventListener('mousedown', () => leftHeld = true);
  document.getElementById('leftBtn').addEventListener('mouseup', () => leftHeld = false);
  document.getElementById('rightBtn').addEventListener('mousedown', () => rightHeld = true);
  document.getElementById('rightBtn').addEventListener('mouseup', () => rightHeld = false);

  update();
</script>
</body>
</html>
