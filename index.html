<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Racing Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0d0000; color: white; font-family: Arial, sans-serif; text-align: center; }
    .screen { display: none; min-height: 100vh; }
    .screen.active { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
    #menuScreen { background: linear-gradient(135deg, #1a0000, #0d0000); }
    #menuScreen h1 { font-size: 3em; color: #ff0000; text-shadow: 0 0 30px #ff0000; letter-spacing: 4px; margin-bottom: 10px; }
    #menuScreen p { opacity: 0.7; margin-bottom: 40px; font-size: 1.1em; }
    #garageScreen { background: linear-gradient(135deg, #1a0000, #0d0000); }
    #garageScreen h2 { font-size: 2em; color: #ff0000; margin-bottom: 10px; }
    #garageScreen p { opacity: 0.7; margin-bottom: 30px; }
    .car-options { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; margin-bottom: 30px; }
    .car-option { width: 100px; padding: 15px; border-radius: 16px; cursor: pointer; border: 3px solid transparent; background: #1a1a1a; }
    .car-option.selected { border-color: #ff0000; box-shadow: 0 0 15px #ff000066; }
    .car-preview { width: 40px; height: 70px; border-radius: 8px; margin: 0 auto 10px; }
    .car-option span { font-size: 0.85em; opacity: 0.8; }
    .big-btn { display: block; width: 260px; padding: 18px; margin: 10px auto; font-size: 1.3em; font-weight: bold; border-radius: 30px; cursor: pointer; border: none; }
    .red-btn { background: #ff0000; color: white; box-shadow: 0 0 20px #ff000088; }
    .outline-btn { background: transparent; color: white; border: 2px solid #ff0000; }
    .dark-btn { background: #222; color: white; border: 2px solid #ff0000; }
    #gameScreen { display: none; flex-direction: column; min-height: 100vh; }
    #gameScreen.active { display: flex; }
    header { background: linear-gradient(135deg, #ff0000, #8b0000); padding: 20px; }
    header h1 { font-size: 2em; letter-spacing: 4px; }
    canvas { border-radius: 12px; display: block; margin: 0 auto; }
    .game-section { padding: 20px; background: #0a0a1a; }
    .score-box { font-size: 1.3em; margin: 15px 0; color: #ff4444; }
    .controls { display: flex; justify-content: center; gap: 20px; margin-top: 20px; }
    .ctrl-btn { padding: 20px 40px; font-size: 1.5em; background: #cc0000; color: white; border: none; border-radius: 16px; cursor: pointer; user-select: none; -webkit-user-select: none; }
    .ctrl-btn:active { background: #8b0000; }
    #restartBtn, #homeBtn { display: none; margin: 8px auto; padding: 12px 30px; font-size: 1em; font-weight: bold; border-radius: 20px; cursor: pointer; }
    #restartBtn { background: #cc0000; color: white; border: none; }
    #homeBtn { background: transparent; color: white; border: 2px solid #ff0000; }
  </style>
</head>
<body>

<!-- MENU -->
<div id="menuScreen" class="screen active">
  <div style="font-size:5em; margin-bottom:10px;">🏎️</div>
  <h1>RACING GAME</h1>
  <p>Dodge enemies. Beat your score!</p>
  <button class="big-btn red-btn" id="startBtn">▶ START GAME</button>
  <button class="big-btn dark-btn" id="garageBtn">🚗 GARAGE</button>
</div>

<!-- GARAGE -->
<div id="garageScreen" class="screen">
  <div style="font-size:3em; margin-bottom:10px;">🚗</div>
  <h2>GARAGE</h2>
  <p>Pick your car color!</p>
  <div class="car-options">
    <div class="car-option selected" id="car-white">
      <div class="car-preview" style="background:#ffffff;"></div>
      <span>White</span>
    </div>
    <div class="car-option" id="car-blue">
      <div class="car-preview" style="background:#0044ff;"></div>
      <span>Blue</span>
    </div>
  </div>
  <button class="big-btn red-btn" id="garageStartBtn">▶ START GAME</button>
  <button class="big-btn outline-btn" id="backBtn">← Back</button>
</div>

<!-- GAME -->
<div id="gameScreen" class="screen">
  <header><h1>🏎️ RACING GAME</h1></header>
  <section class="game-section">
    <div class="score-box">Score: <span id="score">0</span> &nbsp;|&nbsp; Best: <span id="best">0</span></div>
    <canvas id="gameCanvas" width="320" height="500"></canvas>
    <button id="restartBtn">🔄 Play Again</button>
    <button id="homeBtn">🏠 Main Menu</button>
    <div class="controls">
      <button class="ctrl-btn" id="leftBtn">⬅️</button>
      <button class="ctrl-btn" id="rightBtn">➡️</button>
    </div>
  </section>
</div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  let carColor = '#ffffff', carWindow = '#aaddff', carWheel = '#ff0000';

  // Particles for explosion
  let particles = [];
  // Trees
  let trees = [
    { x: 10, y: 0 }, { x: 10, y: 150 }, { x: 10, y: 300 }, { x: 10, y: 450 },
    { x: 295, y: 0 }, { x: 295, y: 150 }, { x: 295, y: 300 }, { x: 295, y: 450 }
  ];
  // City buildings
  let buildings = [
    { x: 0, w: 30, h: 80, y: 50 },
    { x: 285, w: 35, h: 100, y: 30 },
  ];

  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  document.getElementById('startBtn').addEventListener('click', function() { showScreen('gameScreen'); restartGame(); });
  document.getElementById('garageBtn').addEventListener('click', function() { showScreen('garageScreen'); });
  document.getElementById('garageStartBtn').addEventListener('click', function() { showScreen('gameScreen'); restartGame(); });
  document.getElementById('backBtn').addEventListener('click', function() { showScreen('menuScreen'); });
  document.getElementById('restartBtn').addEventListener('click', function() { restartGame(); });
  document.getElementById('homeBtn').addEventListener('click', function() { showScreen('menuScreen'); });

  document.getElementById('car-white').addEventListener('click', function() {
    carColor = '#ffffff'; carWindow = '#aaddff'; carWheel = '#ff0000';
    document.querySelectorAll('.car-option').forEach(e => e.classList.remove('selected'));
    this.classList.add('selected');
  });
  document.getElementById('car-blue').addEventListener('click', function() {
    carColor = '#0044ff'; carWindow = '#aaddff'; carWheel = '#ffffff';
    document.querySelectorAll('.car-option').forEach(e => e.classList.remove('selected'));
    this.classList.add('selected');
  });

  function playCrashSound() {
    audioCtx.resume();
    const bufferSize = audioCtx.sampleRate * 0.6;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2);
    }
    const source = audioCtx.createBufferSource();
    source.buffer = buffer;
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(1.5, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
    source.connect(gain); gain.connect(audioCtx.destination);
    source.start();
  }

  function spawnExplosion(x, y) {
    for (let i = 0; i < 30; i++) {
      particles.push({
        x: x + 25, y: y + 40,
        vx: (Math.random() - 0.5) * 8,
        vy: (Math.random() - 0.5) * 8,
        life: 1.0,
        color: ['#ff0000','#ff6600','#ffff00','#ffffff'][Math.floor(Math.random()*4)],
        size: Math.random() * 8 + 2
      });
    }
  }

  function drawParticles() {
    particles.forEach(p => {
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
      p.x += p.vx;
      p.y += p.vy;
      p.life -= 0.03;
      p.size *= 0.95;
    });
    ctx.globalAlpha = 1;
    particles = particles.filter(p => p.life > 0);
  }

  function drawBackground(offset) {
    // Night sky gradient
    const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
    grad.addColorStop(0, '#0a0a2a');
    grad.addColorStop(1, '#1a0a0a');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Stars
    ctx.fillStyle = '#ffffff88';
    [[20,30],[80,20],[150,10],[250,25],[300,15],[50,60],[200,50]].forEach(([x,y]) => {
      ctx.beginPath();
      ctx.arc(x, y, 1.5, 0, Math.PI*2);
      ctx.fill();
    });

    // City buildings left
    ctx.fillStyle = '#1a1a3a';
    ctx.fillRect(0, 80, 25, 120);
    ctx.fillStyle = '#2a2a4a';
    ctx.fillRect(0, 50, 20, 150);
    // Windows
    ctx.fillStyle = '#ffff0066';
    for(let r=0; r<3; r++) for(let c=0; c<2; c++) {
      ctx.fillRect(3 + c*8, 60 + r*15, 5, 7);
    }

    // City buildings right
    ctx.fillStyle = '#1a1a3a';
    ctx.fillRect(295, 60, 25, 140);
    ctx.fillStyle = '#2a2a4a';
    ctx.fillRect(300, 40, 20, 160);
    ctx.fillStyle = '#ffff0066';
    for(let r=0; r<3; r++) for(let c=0; c<2; c++) {
      ctx.fillRect(302 + c*8, 55 + r*15, 5, 7);
    }

    // Road
    ctx.fillStyle = '#2a2a2a';
    ctx.fillRect(30, 0, 260, canvas.height);

    // Road edges
    ctx.fillStyle = '#ffffff44';
    ctx.fillRect(30, 0, 5, canvas.height);
    ctx.fillRect(285, 0, 5, canvas.height);

    // Moving trees left
    trees.forEach(t => {
      const ty = (t.y + offset) % (canvas.height + 60) - 30;
      // Tree trunk
      ctx.fillStyle = '#4a2800';
      ctx.fillRect(t.x + 5, ty + 20, 6, 15);
      // Tree top
      ctx.fillStyle = '#1a5c1a';
      ctx.beginPath();
      ctx.arc(t.x + 8, ty + 15, 12, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#2a7a2a';
      ctx.beginPath();
      ctx.arc(t.x + 8, ty + 8, 9, 0, Math.PI*2);
      ctx.fill();
    });

    // Road dashes
    ctx.fillStyle = '#ffffff66';
    for (let i = -1; i < 13; i++) {
      ctx.fillRect(canvas.width/2 - 4, i * 40 + (offset % 40), 8, 25);
    }
  }

  function drawCar(x, y, body, win, wheel) {
    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(x + 25, y + 82, 22, 6, 0, 0, Math.PI*2);
    ctx.fill();

    // Body
    ctx.fillStyle = body;
    ctx.beginPath();
    ctx.roundRect(x, y + 20, 50, 55, 6);
    ctx.fill();

    // Roof
    ctx.fillStyle = body;
    ctx.beginPath();
    ctx.roundRect(x + 8, y, 34, 30, 8);
    ctx.fill();

    // Windshield
    ctx.fillStyle = win;
    ctx.beginPath();
    ctx.roundRect(x + 10, y + 4, 30, 18, 4);
    ctx.fill();

    // Headlights
    ctx.fillStyle = '#ffffaa';
    ctx.beginPath(); ctx.arc(x + 10, y + 22, 5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 40, y + 22, 5, 0, Math.PI*2); ctx.fill();

    // Taillights
    ctx.fillStyle = '#ff2200';
    ctx.beginPath(); ctx.arc(x + 10, y + 68, 4, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 40, y + 68, 4, 0, Math.PI*2); ctx.fill();

    // Wheels
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.arc(x + 8, y + 30, 9, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 42, y + 30, 9, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 8, y + 62, 9, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 42, y + 62, 9, 0, Math.PI*2); ctx.fill();

    ctx.fillStyle = wheel;
    ctx.beginPath(); ctx.arc(x + 8, y + 30, 5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 42, y + 30, 5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 8, y + 62, 5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 42, y + 62, 5, 0, Math.PI*2); ctx.fill();
  }

  let playerX = 130, score = 0, best = 0, gameOver = true;
  let enemyX = 100, enemyY = -100, enemySpeed = 5;
  let roadOffset = 0, leftHeld = false, rightHeld = false;
  const playerW = 50, playerH = 80, enemyW = 50, enemyH = 80;
  const playerY = canvas.height - 130;

  function handleHold() {
    if (leftHeld) playerX = Math.max(35, playerX - 8);
    if (rightHeld) playerX = Math.min(canvas.width - playerW - 35, playerX + 8);
  }

  function update() {
    if (gameOver) {
      drawParticles();
      return;
    }
    handleHold();
    enemyY += enemySpeed;
    roadOffset = (roadOffset + enemySpeed) % (canvas.height + 60);

    if (enemyY > canvas.height) {
      enemyY = -120;
      enemyX = Math.random() * (canvas.width - enemyW - 80) + 40;
      score++;
      document.getElementById('score').textContent = score;
      if (score > best) { best = score; document.getElementById('best').textContent = best; }
      enemySpeed += 0.3;
    }

    const margin = 15;
    if (playerX + margin < enemyX + enemyW - margin &&
        playerX + playerW - margin > enemyX + margin &&
        playerY + margin < enemyY + enemyH - margin &&
        playerY + playerH - margin > enemyY + margin) {
      gameOver = true;
      playCrashSound();
      spawnExplosion(playerX, playerY);
      document.getElementById('restartBtn').style.display = 'block';
      document.getElementById('homeBtn').style.display = 'block';

      setTimeout(() => {
        ctx.fillStyle = 'rgba(0,0,0,0.75)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ff0000';
        ctx.font = 'bold 38px Arial';
        ctx.fillText('GAME OVER', 35, canvas.height/2 - 20);
        ctx.fillStyle = 'white';
        ctx.font = '24px Arial';
        ctx.fillText('Score: ' + score, 110, canvas.height/2 + 30);
      }, 800);
      return;
    }

    drawBackground(roadOffset);
    drawParticles();
    drawCar(enemyX, enemyY, '#ff0000', '#ff8888', '#333333');
    drawCar(playerX, playerY, carColor, carWindow, carWheel);
    requestAnimationFrame(update);
  }

  function restartGame() {
    playerX = 130; score = 0; enemyY = -120;
    enemyX = 100; enemySpeed = 5; gameOver = false;
    leftHeld = false; rightHeld = false; particles = [];
    document.getElementById('score').textContent = 0;
    document.getElementById('restartBtn').style.display = 'none';
    document.getElementById('homeBtn').style.display = 'none';
    update();
  }

  document.getElementById('leftBtn').addEventListener('touchstart', e => { e.preventDefault(); leftHeld = true; audioCtx.resume(); });
  document.getElementById('leftBtn').addEventListener('touchend', e => { e.preventDefault(); leftHeld = false; });
  document.getElementById('rightBtn').addEventListener('touchstart', e => { e.preventDefault(); rightHeld = true; audioCtx.resume(); });
  document.getElementById('rightBtn').addEventListener('touchend', e => { e.preventDefault(); rightHeld = false; });
  document.getElementById('leftBtn').addEventListener('mousedown', () => { leftHeld = true; audioCtx.resume(); });
  document.getElementById('leftBtn').addEventListener('mouseup', () => leftHeld = false);
  document.getElementById('rightBtn').addEventListener('mousedown', () => { rightHeld = true; audioCtx.resume(); });
  document.getElementById('rightBtn').addEventListener('mouseup', () => rightHeld = false);
</script>
</body>
</html>
