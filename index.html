<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Neon Drift Mobile</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05050f;
      font-family: system-ui, -apple-system, sans-serif;
      color: #e0e0ff;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    #wrap {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #05050f;
    }
    #game-box {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 100%;
      max-height: 100dvh;
      overflow: hidden;
      background: #0a0a18;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    /* Top HUD */
    #hud {
      position: absolute;
      top: 0;
      left: 0; right: 0;
      padding: 12px 14px 0;
      padding-top: max(12px, env(safe-area-inset-top));
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      z-index: 10;
      text-shadow: 0 1px 4px #000;
      font-weight: 700;
      font-size: 15px;
    }
    #score { color: #00ffcc; }
    #hs { color: #ff66cc; font-size: 13px; }
    #speed { color: #ffaa00; }
    #status {
      position: absolute;
      top: 48px;
      left: 0; right: 0;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      pointer-events: none;
      z-index: 10;
      text-shadow: 0 1px 4px #000;
    }
    /* Bottom controls */
    #controls {
      position: absolute;
      bottom: 0;
      left: 0; right: 0;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      pointer-events: none;
      z-index: 15;
    }
    .ctrl-btn {
      pointer-events: auto;
      width: 42%;
      height: 70px;
      margin: 0 4%;
      margin-bottom: 8px;
      border: none;
      border-radius: 16px;
      font-size: 28px;
      font-weight: 800;
      color: #fff;
      background: rgba(0, 40, 60, 0.75);
      border: 2px solid rgba(0, 200, 255, 0.4);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      active: scale(0.96);
      transition: transform 0.08s, background 0.1s;
    }
    .ctrl-btn:active, .ctrl-btn.pressed {
      background: rgba(0, 180, 220, 0.55);
      transform: scale(0.95);
    }
    #btn-left { border-color: rgba(0, 200, 255, 0.5); }
    #btn-right { border-color: rgba(0, 200, 255, 0.5); }
    /* Top right small buttons */
    #top-btns {
      position: absolute;
      top: max(10px, env(safe-area-inset-top));
      right: 10px;
      display: flex;
      gap: 8px;
      z-index: 20;
    }
    .icon-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid #446;
      background: rgba(20,20,40,0.85);
      color: #aaf;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
    }
    /* Overlay */
    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(4,4,18,0.94);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 30;
      padding: 20px;
      backdrop-filter: blur(8px);
    }
    #overlay h2 {
      font-size: 2.2rem;
      letter-spacing: 3px;
      margin-bottom: 12px;
      background: linear-gradient(90deg, #00f0ff, #ff00aa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    #overlay p {
      color: #99a;
      font-size: 15px;
      line-height: 1.5;
      max-width: 300px;
      margin-bottom: 6px;
    }
    .final-score {
      font-size: 1.5rem;
      color: #00ffcc;
      margin: 16px 0 4px;
    }
    .high-score-line {
      color: #ff66cc;
      font-size: 1.1rem;
      margin-bottom: 10px;
    }
    #start-btn {
      margin-top: 24px;
      padding: 16px 48px;
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: #0a0a12;
      background: linear-gradient(135deg, #00f0ff, #00ccaa);
      border: none;
      border-radius: 12px;
      box-shadow: 0 0 30px rgba(0,240,255,0.5);
    }
    #start-btn:active { transform: scale(0.96); }
    .tip {
      margin-top: 28px;
      font-size: 13px;
      color: #556;
      line-height: 1.6;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="game-box">
      <canvas id="game"></canvas>

      <div id="hud">
        <span id="score">0</span>
        <span id="hs">Best 0</span>
        <span id="speed">1.0x</span>
      </div>
      <div id="status"></div>

      <div id="top-btns">
        <button class="icon-btn" id="mute-btn">🔊</button>
        <button class="icon-btn" id="pause-btn">⏸</button>
      </div>

      <div id="controls">
        <button class="ctrl-btn" id="btn-left">◀</button>
        <button class="ctrl-btn" id="btn-right">▶</button>
      </div>

      <div id="overlay">
        <h2 id="title">NEON DRIFT</h2>
        <p id="message">Dodge traffic • Grab shields & nitro<br>Survive the neon night</p>
        <p class="final-score hidden" id="final-score"></p>
        <p class="high-score-line hidden" id="new-best"></p>
        <button id="start-btn">START RACE</button>
        <p class="tip">Hold LEFT / RIGHT buttons<br>or swipe on the road</p>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const titleEl = document.getElementById('title');
    const messageEl = document.getElementById('message');
    const finalScoreEl = document.getElementById('final-score');
    const newBestEl = document.getElementById('new-best');
    const startBtn = document.getElementById('start-btn');
    const scoreEl = document.getElementById('score');
    const speedEl = document.getElementById('speed');
    const hsEl = document.getElementById('hs');
    const statusEl = document.getElementById('status');
    const muteBtn = document.getElementById('mute-btn');
    const pauseBtn = document.getElementById('pause-btn');
    const btnLeft = document.getElementById('btn-left');
    const btnRight = document.getElementById('btn-right');

    // Logical size (portrait)
    let W = 400, H = 700;
    function resize() {
      const box = document.getElementById('game-box');
      const rw = box.clientWidth;
      const rh = box.clientHeight;
      // keep aspect ~ 4:7
      const scale = Math.min(rw / 400, rh / 700);
      W = 400;
      H = Math.round(rh / scale);
      if (H < 600) H = 600;
      canvas.width = W;
      canvas.height = H;
      canvas.style.width = rw + 'px';
      canvas.style.height = rh + 'px';
    }
    resize();
    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', () => setTimeout(resize, 150));

    const ROAD_L = 50, ROAD_R = () => W - 50;
    const LANE_W = () => (ROAD_R() - ROAD_L) / 3;
    const PW = 46, PH = 78;

    let running = false, paused = false, muted = false;
    let score = 0, highScore = +localStorage.getItem('neonDriftHS') || 0;
    let speedMult = 1, roadOff = 0;
    let leftHeld = false, rightHeld = false;
    let player = { x: 0, y: 0, shield: 0, nitro: 0 };
    let enemies = [], powerups = [], particles = [], stars = [];
    let lastT = 0, spawnT = 0, powerT = 0, shake = 0, nearMissFlash = 0;
    let animId = null;

    hsEl.textContent = `Best ${highScore}`;

    for (let i = 0; i < 60; i++) {
      stars.push({ x: Math.random()*400, y: Math.random()*700, s: Math.random()*1.5+0.3, sp: Math.random()*0.35+0.1 });
    }

    // Audio
    let actx, engOsc, engGain, engFilt, noiseGain, master;
    function initAudio() {
      if (actx) return;
      actx = new (window.AudioContext || window.webkitAudioContext)();
      master = actx.createGain();
      master.gain.value = muted ? 0 : 0.48;
      master.connect(actx.destination);
      engOsc = actx.createOscillator();
      engOsc.type = 'sawtooth';
      engOsc.frequency.value = 50;
      engFilt = actx.createBiquadFilter();
      engFilt.type = 'lowpass';
      engFilt.frequency.value = 250;
      engGain = actx.createGain();
      engGain.gain.value = 0;
      engOsc.connect(engFilt); engFilt.connect(engGain); engGain.connect(master);
      engOsc.start();
      const buf = actx.createBuffer(1, actx.sampleRate*2, actx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
      const ns = actx.createBufferSource(); ns.buffer = buf; ns.loop = true;
      const nf = actx.createBiquadFilter(); nf.type = 'bandpass'; nf.frequency.value = 800;
      noiseGain = actx.createGain(); noiseGain.gain.value = 0;
      ns.connect(nf); nf.connect(noiseGain); noiseGain.connect(master); ns.start();
    }
    function setMute(m) {
      muted = m;
      if (master) master.gain.value = muted ? 0 : 0.48;
      muteBtn.textContent = muted ? '🔇' : '🔊';
    }
    function startEngine() {
      if (!actx) return;
      if (actx.state === 'suspended') actx.resume();
      const t = actx.currentTime;
      engGain.gain.cancelScheduledValues(t);
      engGain.gain.linearRampToValueAtTime(0.16, t+0.3);
      noiseGain.gain.linearRampToValueAtTime(0.05, t+0.3);
    }
    function stopEngine() {
      if (!actx) return;
      const t = actx.currentTime;
      engGain.gain.cancelScheduledValues(t);
      engGain.gain.linearRampToValueAtTime(0, t+0.25);
      noiseGain.gain.cancelScheduledValues(t);
      noiseGain.gain.linearRampToValueAtTime(0, t+0.25);
    }
    function updateEngine(m) {
      if (!actx || !engOsc) return;
      engOsc.frequency.setTargetAtTime(46 + m*40, actx.currentTime, 0.08);
      engFilt.frequency.setTargetAtTime(190 + m*190, actx.currentTime, 0.1);
      noiseGain.gain.setTargetAtTime(0.03 + m*0.04, actx.currentTime, 0.1);
    }
    function sfx(type) {
      if (!actx || muted) return;
      const t = actx.currentTime;
      if (type === 'crash') {
        const o = actx.createOscillator(); o.type = 'sine';
        o.frequency.setValueAtTime(100, t); o.frequency.exponentialRampToValueAtTime(22, t+0.5);
        const g = actx.createGain(); g.gain.setValueAtTime(0.6, t); g.gain.exponentialRampToValueAtTime(0.001, t+0.55);
        o.connect(g); g.connect(master); o.start(t); o.stop(t+0.6);
        const buf = actx.createBuffer(1, actx.sampleRate*0.3, actx.sampleRate);
        const d = buf.getChannelData(0);
        for (let i=0;i<d.length;i++) d[i] = (Math.random()*2-1)*Math.pow(1-i/d.length,1.4);
        const s = actx.createBufferSource(); s.buffer = buf;
        const f = actx.createBiquadFilter(); f.type='lowpass';
        f.frequency.setValueAtTime(2000,t); f.frequency.exponentialRampToValueAtTime(160,t+0.28);
        const ng = actx.createGain(); ng.gain.setValueAtTime(0.45,t); ng.gain.exponentialRampToValueAtTime(0.001,t+0.32);
        s.connect(f); f.connect(ng); ng.connect(master); s.start(t);
      } else if (type === 'pass' || type === 'near') {
        const o = actx.createOscillator(); o.type = 'triangle';
        o.frequency.setValueAtTime(type==='near'?900:700, t);
        o.frequency.exponentialRampToValueAtTime(type==='near'?1500:1300, t+0.08);
        const g = actx.createGain(); g.gain.setValueAtTime(0.1, t); g.gain.exponentialRampToValueAtTime(0.001, t+0.12);
        o.connect(g); g.connect(master); o.start(t); o.stop(t+0.14);
      } else if (type === 'power') {
        [0,0.07,0.14].forEach((off,i)=>{
          const o = actx.createOscillator(); o.type='square'; o.frequency.value=420*(i+1);
          const g = actx.createGain(); g.gain.setValueAtTime(0.09,t+off); g.gain.exponentialRampToValueAtTime(0.001,t+off+0.09);
          o.connect(g); g.connect(master); o.start(t+off); o.stop(t+off+0.11);
        });
      } else if (type === 'start') {
        [0,0.15,0.3].forEach((off,i)=>{
          const o = actx.createOscillator(); o.type='square'; o.frequency.value=i===2?620:400;
          const g = actx.createGain(); g.gain.setValueAtTime(0.12,t+off); g.gain.exponentialRampToValueAtTime(0.001,t+off+0.1);
          o.connect(g); g.connect(master); o.start(t+off); o.stop(t+off+0.13);
        });
      }
    }

    function reset() {
      score = 0; speedMult = 1; roadOff = 0;
      player = { x: W/2 - PW/2, y: H - 150, shield: 0, nitro: 0 };
      enemies = []; powerups = []; particles = [];
      spawnT = 0; powerT = 0; shake = 0; nearMissFlash = 0;
      leftHeld = rightHeld = false;
      scoreEl.textContent = '0';
      speedEl.textContent = '1.0x';
      statusEl.textContent = '';
      btnLeft.classList.remove('pressed');
      btnRight.classList.remove('pressed');
    }
    function startGame() {
      initAudio();
      sfx('start');
      reset();
      overlay.classList.add('hidden');
      running = true; paused = false;
      pauseBtn.textContent = '⏸';
      startEngine();
      lastT = performance.now();
      loop(lastT);
    }
    function gameOver() {
      running = false;
      cancelAnimationFrame(animId);
      stopEngine();
      sfx('crash');
      shake = 16;
      titleEl.textContent = 'CRASHED!';
      messageEl.textContent = 'Try again — the night is long.';
      finalScoreEl.textContent = `Score ${Math.floor(score)}`;
      finalScoreEl.classList.remove('hidden');
      if (score > highScore) {
        highScore = Math.floor(score);
        localStorage.setItem('neonDriftHS', highScore);
        hsEl.textContent = `Best ${highScore}`;
        newBestEl.textContent = '★ NEW BEST ★';
        newBestEl.classList.remove('hidden');
      } else newBestEl.classList.add('hidden');
      startBtn.textContent = 'RACE AGAIN';
      overlay.classList.remove('hidden');
    }
    function togglePause() {
      if (!running) return;
      paused = !paused;
      if (paused) {
        stopEngine();
        statusEl.textContent = 'PAUSED';
        statusEl.style.color = '#ffaa00';
        pauseBtn.textContent = '▶';
      } else {
        startEngine();
        statusEl.textContent = '';
        pauseBtn.textContent = '⏸';
        lastT = performance.now();
        loop(lastT);
      }
    }

    // Touch buttons
    function hold(btn, side, on) {
      if (side === 'l') leftHeld = on;
      else rightHeld = on;
      btn.classList.toggle('pressed', on);
    }
    ['touchstart','mousedown'].forEach(ev => {
      btnLeft.addEventListener(ev, e => { e.preventDefault(); hold(btnLeft,'l',true); });
      btnRight.addEventListener(ev, e => { e.preventDefault(); hold(btnRight,'r',true); });
    });
    ['touchend','touchcancel','mouseup','mouseleave'].forEach(ev => {
      btnLeft.addEventListener(ev, () => hold(btnLeft,'l',false));
      btnRight.addEventListener(ev, () => hold(btnRight,'r',false));
    });

    // Swipe on canvas
    let touchX = null;
    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      touchX = e.touches[0].clientX;
    }, {passive:false});
    canvas.addEventListener('touchmove', e => {
      e.preventDefault();
      if (!running || paused) return;
      const dx = e.touches[0].clientX - touchX;
      player.x += dx * (W / canvas.clientWidth) * 0.9;
      player.x = Math.max(ROAD_L+3, Math.min(ROAD_R()-PW-3, player.x));
      touchX = e.touches[0].clientX;
    }, {passive:false});
    canvas.addEventListener('touchend', () => touchX = null);

    startBtn.addEventListener('click', startGame);
    muteBtn.addEventListener('click', () => setMute(!muted));
    pauseBtn.addEventListener('click', togglePause);

    // Prevent page scroll
    document.addEventListener('touchmove', e => { if (e.target.closest('#game-box')) e.preventDefault(); }, {passive:false});

    function spawnEnemy() {
      const lane = Math.floor(Math.random()*3);
      const x = ROAD_L + lane*LANE_W() + (LANE_W()-44)/2;
      const cols = ['#ff3366','#ffaa00','#aa44ff','#44ff88','#ff6688'];
      enemies.push({ x, y:-95, w:44, h:74, color:cols[Math.floor(Math.random()*cols.length)],
        speed:2.3+Math.random()*1.7, nearMissed:false });
    }
    function spawnPower() {
      const lane = Math.floor(Math.random()*3);
      const x = ROAD_L + lane*LANE_W() + LANE_W()/2 - 15;
      powerups.push({ x, y:-45, type: Math.random()<0.55?'shield':'nitro', r:15 });
    }
    function burst(x,y,n,cols) {
      for (let i=0;i<n;i++) {
        particles.push({
          x,y, vx:(Math.random()-0.5)*9, vy:(Math.random()-0.5)*9,
          life:28+Math.random()*22, max:50,
          color:cols[Math.floor(Math.random()*cols.length)], size:Math.random()*3+1.2
        });
      }
    }

    function update(dt) {
      if (shake > 0) shake *= 0.87;
      if (nearMissFlash > 0) nearMissFlash -= dt*4;

      const nitroBoost = player.nitro > 0 ? 1.5 : 1;
      const base = 4.3 * speedMult * nitroBoost;
      roadOff = (roadOff + base*1.9) % 50;

      stars.forEach(s => {
        s.y += s.sp * base * 0.3;
        if (s.y > H) { s.y = 0; s.x = Math.random()*W; }
      });

      const move = 6.2 * speedMult * (player.nitro>0 ? 1.2 : 1);
      if (leftHeld) player.x -= move;
      if (rightHeld) player.x += move;
      player.x = Math.max(ROAD_L+3, Math.min(ROAD_R()-PW-3, player.x));

      if (player.shield > 0) player.shield -= dt;
      if (player.nitro > 0) player.nitro -= dt;

      if (Math.random() < 0.4) {
        particles.push({
          x: player.x+PW/2+(Math.random()-0.5)*12, y: player.y+PH-2,
          vx:(Math.random()-0.5)*1.1, vy:Math.random()*2+1.2,
          life:16+Math.random()*12, max:28,
          color: player.nitro>0 ? '#00ffff' : '#2a7a9a', size:Math.random()*2+0.8
        });
      }

      spawnT += dt;
      if (spawnT > Math.max(0.36, 1.0 - speedMult*0.27)) { spawnEnemy(); spawnT = 0; }
      powerT += dt;
      if (powerT > 7 + Math.random()*4) { spawnPower(); powerT = 0; }

      for (let i=enemies.length-1; i>=0; i--) {
        const e = enemies[i];
        e.y += (base + e.speed)*0.9;

        if (!e.nearMissed && e.y > player.y-25 && e.y < player.y+PH) {
          const dx = Math.abs((e.x+e.w/2)-(player.x+PW/2));
          if (dx < 60 && dx > 30) {
            e.nearMissed = true; score += 25; nearMissFlash = 1; sfx('near');
            statusEl.textContent = 'NEAR MISS +25'; statusEl.style.color = '#00ffaa';
            setTimeout(()=>{ if(statusEl.textContent.includes('NEAR')) statusEl.textContent=''; },650);
            burst((e.x+player.x)/2+20, player.y+20, 7, ['#00ffcc','#fff']);
          }
        }

        if (player.x < e.x+e.w-8 && player.x+PW > e.x+8 &&
            player.y < e.y+e.h-12 && player.y+PH > e.y+12) {
          if (player.shield > 0) {
            player.shield = 0; enemies.splice(i,1);
            burst(e.x+e.w/2, e.y+e.h/2, 18, ['#00aaff','#fff','#88ccff']);
            sfx('power'); statusEl.textContent = 'SHIELD BROKEN'; statusEl.style.color = '#00aaff';
            setTimeout(()=>{ if(statusEl.textContent.includes('SHIELD')) statusEl.textContent=''; },750);
            continue;
          }
          burst(player.x+PW/2, player.y+PH/2, 38, ['#ff3366','#ffaa00','#ff6688','#fff']);
          gameOver(); return;
        }
        if (e.y > H+40) { enemies.splice(i,1); score += 12; sfx('pass'); }
      }

      for (let i=powerups.length-1; i>=0; i--) {
        const p = powerups[i];
        p.y += base*0.85;
        if (player.x < p.x+p.r*2 && player.x+PW > p.x &&
            player.y < p.y+p.r*2 && player.y+PH > p.y) {
          if (p.type === 'shield') {
            player.shield = 6.5; statusEl.textContent = 'SHIELD'; statusEl.style.color = '#00aaff';
          } else {
            player.nitro = 3.6; statusEl.textContent = 'NITRO!'; statusEl.style.color = '#00ffff';
          }
          sfx('power');
          burst(p.x+15, p.y+15, 14, p.type==='shield'?['#00aaff','#88ccff']:['#00ffff','#aaffff']);
          powerups.splice(i,1);
          setTimeout(()=>{ if(statusEl.textContent.match(/SHIELD|NITRO/)) statusEl.textContent=''; },850);
          continue;
        }
        if (p.y > H+20) powerups.splice(i,1);
      }

      for (let i=particles.length-1; i>=0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy; p.life--;
        if (p.life <= 0) particles.splice(i,1);
      }

      score += dt * 13 * speedMult * nitroBoost;
      speedMult = 1 + Math.min(2.7, score/2100);
      scoreEl.textContent = Math.floor(score);
      speedEl.textContent = speedMult.toFixed(1)+'x'+(player.nitro>0?' N':'');
      updateEngine(speedMult * nitroBoost);
    }

    function drawCar(x,y,w,h,color,isPlayer,shield) {
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.roundRect(x, y+6, w, h-14, 7); ctx.fill();
      ctx.fillStyle = isPlayer ? '#002233' : '#1a0011';
      ctx.beginPath(); ctx.roundRect(x+7, y+13, w-14, 24, 4); ctx.fill();
      ctx.fillStyle = isPlayer ? 'rgba(0,220,255,0.45)' : 'rgba(255,80,120,0.3)';
      ctx.fillRect(x+9, y+15, w-18, 9);
      ctx.fillStyle = '#111';
      [[-4,13],[w-1,13],[-4,h-30],[w-1,h-30]].forEach(([ox,oy])=>ctx.fillRect(x+ox,y+oy,5,15));
      if (isPlayer) {
        ctx.fillStyle = '#ffffaa';
        ctx.fillRect(x+7,y+1,9,5); ctx.fillRect(x+w-16,y+1,9,5);
        ctx.shadowColor = player.nitro>0 ? '#00ffff' : '#00f0ff';
        ctx.shadowBlur = 18;
        ctx.fillStyle = player.nitro>0 ? 'rgba(0,255,255,0.4)' : 'rgba(0,240,255,0.3)';
        ctx.fillRect(x-5, y+h-8, w+10, 7);
        ctx.shadowBlur = 0;
        if (shield > 0) {
          ctx.strokeStyle = `rgba(0,170,255,${0.45+Math.sin(performance.now()/120)*0.3})`;
          ctx.lineWidth = 3;
          ctx.beginPath(); ctx.arc(x+w/2, y+h/2, 40, 0, Math.PI*2); ctx.stroke();
        }
      } else {
        ctx.fillStyle = '#ff2222';
        ctx.fillRect(x+7,y+h-9,9,5); ctx.fillRect(x+w-16,y+h-9,9,5);
      }
    }

    function draw() {
      const sx = shake>0.5 ? (Math.random()-0.5)*shake : 0;
      const sy = shake>0.5 ? (Math.random()-0.5)*shake : 0;
      ctx.save(); ctx.translate(sx,sy);

      const g = ctx.createLinearGradient(0,0,0,H);
      g.addColorStop(0,'#05051a'); g.addColorStop(1,'#0a0a22');
      ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

      stars.forEach(s => {
        ctx.globalAlpha = 0.35 + s.s*0.4;
        ctx.fillStyle = '#cce';
        ctx.beginPath(); ctx.arc(s.x, s.y, s.s, 0, Math.PI*2); ctx.fill();
      });
      ctx.globalAlpha = 1;

      ctx.fillStyle = '#0a150a';
      ctx.fillRect(0,0,ROAD_L,H); ctx.fillRect(ROAD_R(),0,W-ROAD_R(),H);

      ctx.fillStyle = '#12122a';
      ctx.fillRect(ROAD_L,0,ROAD_R()-ROAD_L,H);

      ctx.strokeStyle = '#ffcc00'; ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(ROAD_L,0); ctx.lineTo(ROAD_L,H);
      ctx.moveTo(ROAD_R(),0); ctx.lineTo(ROAD_R(),H);
      ctx.stroke();

      ctx.strokeStyle = '#dde'; ctx.lineWidth = 3;
      ctx.setLineDash([20,30]); ctx.lineDashOffset = -roadOff;
      for (let i=1;i<3;i++) {
        const lx = ROAD_L + i*LANE_W();
        ctx.beginPath(); ctx.moveTo(lx,0); ctx.lineTo(lx,H); ctx.stroke();
      }
      ctx.setLineDash([]);

      if (nearMissFlash > 0) {
        ctx.fillStyle = `rgba(0,255,180,${nearMissFlash*0.14})`;
        ctx.fillRect(ROAD_L,0,ROAD_R()-ROAD_L,H);
      }

      powerups.forEach(p => {
        const pulse = 1 + Math.sin(performance.now()/140)*0.12;
        ctx.beginPath(); ctx.arc(p.x+p.r, p.y+p.r, p.r*pulse, 0, Math.PI*2);
        ctx.fillStyle = p.type==='shield' ? 'rgba(0,140,255,0.85)' : 'rgba(0,220,255,0.85)';
        ctx.fill();
        ctx.strokeStyle = p.type==='shield' ? '#88ccff' : '#aaffff';
        ctx.lineWidth = 2; ctx.stroke();
        ctx.fillStyle = '#fff'; ctx.font = 'bold 12px sans-serif';
        ctx.textAlign = 'center'; ctx.fillText(p.type==='shield'?'S':'N', p.x+p.r, p.y+p.r+4);
      });

      enemies.forEach(e => drawCar(e.x,e.y,e.w,e.h,e.color,false));
      drawCar(player.x, player.y, PW, PH, player.nitro>0?'#00eebb':'#00f0ff', true, player.shield);

      particles.forEach(p => {
        ctx.globalAlpha = Math.max(0, p.life/p.max);
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill();
      });
      ctx.globalAlpha = 1;
      ctx.restore();
    }

    function loop(now) {
      if (!running || paused) return;
      const dt = Math.min((now-lastT)/1000, 0.05);
      lastT = now;
      update(dt);
      draw();
      animId = requestAnimationFrame(loop);
    }

    // first paint
    player.x = W/2 - PW/2; player.y = H - 150;
    draw();
  </script>
</body>
</html>
